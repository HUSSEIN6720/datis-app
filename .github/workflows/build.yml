name: Build APK
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer Cython

      - name: Accept Android SDK licenses
        run: |
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.android/licenses/android-sdk-license

      # ✅ مرحله جدید: نصب NDK نسخه 28c
      - name: Install NDK 28c
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r28c-linux.zip
          unzip android-ndk-r28c-linux.zip
          mkdir -p /home/runner/.buildozer/android/platform/
          mv android-ndk-r28c /home/runner/.buildozer/android/platform/android-ndk-r28c
          export ANDROID_NDK=/home/runner/.buildozer/android/platform/android-ndk-r28c
          export ANDROID_NDK_HOME=/home/runner/.buildozer/android/platform/android-ndk-r28c
          echo "ANDROID_NDK=/home/runner/.buildozer/android/platform/android-ndk-r28c" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=/home/runner/.buildozer/android/platform/android-ndk-r28c" >> $GITHUB_ENV

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: datis-app
          path: bin/*.apk
