name: Build APK
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer Cython

      - name: Accept Android SDK licenses
        run: |
          # ایجاد پوشه
          mkdir -p ~/.android/licenses
          
          # ایجاد فایل مجوزها
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" >> ~/.android/licenses/android-sdk-license
          
          # مجوزهای اضافی
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > ~/.android/licenses/android-sdk-preview-license
          echo "extra-android" > ~/.android/licenses/android-sdk-license
          echo "extra-google" > ~/.android/licenses/android-sdk-license
          echo "extra-m2repository" > ~/.android/licenses/android-sdk-license
          
          # بررسی اینکه فایل ساخته شده
          ls -la ~/.android/licenses/
          cat ~/.android/licenses/android-sdk-license

      - name: Build APK with Buildozer
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: datis-app
          path: bin/*.apk
